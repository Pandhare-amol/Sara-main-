name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install desktop-agent dependencies
        run: python -m pip install -r desktop_agent/requirements.txt

      - name: Type-check and test
        run: npm test

      - name: Production build
        run: npm run build
