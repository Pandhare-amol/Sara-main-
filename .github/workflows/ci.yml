name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install desktop-agent dependencies
        run: python -m pip install -r desktop_agent/requirements.txt

      - name: Type-check
        run: npm run lint

      - name: Agent and intelligence tests
        run: npm run test:agent

      - name: Character tests
        run: npm run test:characters

      - name: Autonomous mind tests
        run: node --import tsx --test cognition/tests/autonomousMind.test.ts

      - name: Cognition manager tests
        run: node --import tsx --test cognition/tests/cognition.test.ts

      - name: API hub tests
        run: npm run test:api-hub

      - name: Screen vision tests
        run: npm run test:screen-vision

      - name: Browser boundary tests
        run: npm run test:real-browser

      - name: Optional live-provider tests
        run: npm run test:live

      - name: Python tests
        run: npm run test:python

      - name: Production build
        run: npm run build
