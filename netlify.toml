# Deployment for Netlify (alternative to Vercel). Same build, same SPA rewrite.
[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), camera=()"
