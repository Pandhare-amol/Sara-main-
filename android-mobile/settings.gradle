// Separate Gradle project for the standalone Sara Mobile app.
// It shares the Capacitor setup with the desktop client app but builds a
// different applicationId, so both can be installed side by side.
include ':app'
// No Cordova plugins are used by the standalone app, so that module is not
// included here (it is generated by `cap sync`, which this project does not run).

apply from: 'capacitor.settings.gradle'